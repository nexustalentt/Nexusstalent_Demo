<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="doc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="doc-coat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="doc-scrub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#doc-bg)" />
  
  <!-- Subtle Medical Glow Cross in Background -->
  <rect x="92" y="30" width="16" height="50" rx="8" fill="#ffffff" opacity="0.15" />
  <rect x="75" y="47" width="50" height="16" rx="8" fill="#ffffff" opacity="0.15" />

  <!-- Doctor Body / Lab Coat -->
  <path d="M 40 196 C 40 148, 70 135, 100 135 C 130 135, 160 148, 160 196 Z" fill="url(#doc-coat)" />
  
  <!-- Scrub V-Neck -->
  <path d="M 85 135 L 100 162 L 115 135 Z" fill="url(#doc-scrub)" />

  <!-- Stethoscope -->
  <path d="M 75 140 C 75 170, 92 185, 100 185 C 108 185, 125 170, 125 140" stroke="#475569" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="100" cy="186" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2" />

  <!-- Neck -->
  <rect x="88" y="112" width="24" height="26" rx="5" fill="#fbcfe8" opacity="0.9" />

  <!-- Head -->
  <circle cx="100" cy="85" r="32" fill="#fed7aa" />

  <!-- Professional Hair -->
  <path d="M 68 85 C 68 55, 80 50, 100 50 C 120 50, 132 55, 132 85 C 125 68, 115 62, 100 62 C 85 62, 75 68, 68 85 Z" fill="#334155" />
  <path d="M 68 82 C 68 95, 74 105, 75 110 C 73 95, 72 85, 74 78 Z" fill="#334155" />
  <path d="M 132 82 C 132 95, 126 105, 125 110 C 127 95, 128 85, 126 78 Z" fill="#334155" />

  <!-- Stethoscope Ear Pieces -->
  <path d="M 80 120 L 76 138" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <path d="M 120 120 L 124 138" stroke="#475569" stroke-width="3" stroke-linecap="round" />

  <!-- Verified Badge -->
  <g transform="translate(140, 140)">
    <circle cx="16" cy="16" r="16" fill="#10b981" />
    <path d="M 10 16 L 14 20 L 22 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
